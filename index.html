                `le quotient vaut 0, on s'arrête. on lit les restes du dernier au premier : <mark>${r.result}</mark>.`,
                `vérification : ${
                  w.terms
                    .filter((t) => t.d)
                    .map((t) => `${t.d} × ${pw(b, t.pos)}`)
                    .join(' + ') || '0'
                } = ${nf(w.total)} <span class="ok">✓</span>`,
              ],
            };
          },
          [
            ['57 en base 2', { 'd-n': '57', 'd-b': '2' }],
            ['200 en base 2', { 'd-n': '200', 'd-b': '2' }],
            ['1000 en base 2', { 'd-n': '1000', 'd-b': '2' }],
            ['500 en base 16', { 'd-n': '500', 'd-b': '16' }],
            ['4660 en base 16', { 'd-n': '4660', 'd-b': '16' }],
            ['48879 en base 16', { 'd-n': '48879', 'd-b': '16' }],
          ],
        );

        tab(
          'poids',
          'vers le décimal',
          () =>
            `<div class="fields">${field('nombre', input('w-n', '3FA'), { wide: true, forId: 'w-n' })}${field('écrit en', baseSelect('w-b', 16), { forId: 'w-b' })}</div>`,
          () => {
            const b = +valueOf('w-b');
            const r = NB.weights(valueOf('w-n'), b);
            if (r.err) return r;
            const letters = r.terms.filter((t) => t.d >= 10n).map((t) => `${t.c} = ${t.d}`);
            const sum =
              b === 2
                ? `on additionne les poids des bits à 1 : ${binSum(r)} = <mark>${nf(r.total)}</mark>.`
                : `${r.terms.map((t) => `${t.d} × ${nf(t.pow)}`).join(' + ')} = ${r.terms.map((t) => nf(t.val)).join(' + ')} = <mark>${nf(r.total)}</mark>.`;
            return {
              answer: `${ans(b === 2 ? G(r.s) : r.s, b)} = ${ans(nf(r.total), 10)}`,
              viz: `<div><h3>chaque chiffre multiplié par son poids</h3>${weightCols(r.terms, b)}</div>${b === 2 ? `<div><h3>positions des bits</h3>${bits(r.s, { weights: true, hex: false, cls: (k) => (r.s[k] === '1' ? 'mt' : 'dim') })}</div>` : ''}`,
              steps: [
                `on numérote les positions de droite à gauche en commençant à 0. le chiffre en position p vaut chiffre × ${pw(b, 'p')}.`,
                ...(letters.length ? [`en hexadécimal, les lettres valent : ${letters.join(', ')}.`] : []),
                `poids utilisés : ${r.terms.map((t) => `${pw(b, t.pos)} = ${nf(t.pow)}`).join(', ')}.`,
                sum,
              ],
            };
          },
          [
            ['11010110 en base 2', { 'w-n': '11010110', 'w-b': '2' }],
            ['100101011 en base 2', { 'w-n': '100101011', 'w-b': '2' }],
            ['3FA en base 16', { 'w-n': '3FA', 'w-b': '16' }],
            ['7C en base 16', { 'w-n': '7C', 'w-b': '16' }],
            ['2AF en base 16', { 'w-n': '2AF', 'w-b': '16' }],
          ],
          { 'w-b': { 2: { 'w-n': '11010110' }, 8: { 'w-n': '755' }, 16: { 'w-n': '3FA' } } },
        );

        tab(
          'binhex',
          'binaire et hexadécimal',
          () =>
            `<div class="fields">${field(
              'sens',
              seg(
                'bh-m',
                [
                  ['b', 'binaire vers hexadécimal'],
                  ['h', 'hexadécimal vers binaire'],
                ],
                'b',
              ),
              { wide: true },
            )}${field('nombre', input('bh-n', '1101011000011'), { wide: true, forId: 'bh-n' })}</div>`,
          () => {
            if (valueOf('bh-m') === 'b') {
              const check = NB.binToHex(valueOf('bh-n'));
              if (check.err) return check;
              const hx = binToHexSection(valueOf('bh-n'));
              const steps = [...hx.steps];
              if (hx.digits !== hx.r.result)
                steps.push(`sans les zéros de tête : <mark>${hx.r.result}</mark>.`);
              return { answer: `${ans(G(hx.r.s), 2)} = ${ans(hx.r.result, 16)}`, viz: hx.viz, steps };
            }
            const check = NB.hexToBin(valueOf('bh-n'));
            if (check.err) return check;
            const hx = hexToBinSection(valueOf('bh-n'));
            const steps = [...hx.steps];
            if (hx.h.full !== hx.h.result)
              steps.push(`sans les zéros de tête : <mark>${G(hx.h.result)}</mark>.`);
            return { answer: `${ans(hx.h.s, 16)} = ${ans(G(hx.h.result), 2)}`, viz: hx.viz, steps };
          },
          [
            ['1101011000011 en hexadécimal', { 'bh-m': 'b', 'bh-n': '1101011000011' }],
            ['10101011101010111 en hexadécimal', { 'bh-m': 'b', 'bh-n': '10101011101010111' }],
            ['A5F en binaire', { 'bh-m': 'h', 'bh-n': 'A5F' }],
            ['3F7 en binaire', { 'bh-m': 'h', 'bh-n': '3F7' }],
          ],
          { 'bh-m': { b: { 'bh-n': '1101011000011' }, h: { 'bh-n': 'A5F' } } },
        );

        tab(
          'operations',
          'addition et soustraction',
          () =>
            `<div class="fields">${field('premier nombre', input('o-a', '10110110'), { wide: true, forId: 'o-a' })}${field(
              'opération',
              seg(
                'o-op',
                [
                  ['+', 'addition'],
                  ['-', 'soustraction'],
                ],
                '+',
              ),
              { wide: true },
            )}${field('second nombre', input('o-b', '1101101'), { wide: true, forId: 'o-b' })}</div>`,
          () => {
            const op = valueOf('o-op');
            const r = NB.addSub(valueOf('o-a'), valueOf('o-b'), op);
            if (r.err) return r;
            const W = r.W,
              sym = op === '+' ? '+' : '−',
              lead = r.R.search(/1/);
            const cell = (s, c = '') => `<span class="${c}">${s}</span>`;
            const grid = [
              cell('', 'c') + r.carry.map((c) => cell(c, 'c')).join(''),
              cell('') + [...r.A].map((c, i) => cell(c, i < W - r.aLen ? 'f' : '')).join(''),
              cell(sym) + [...r.B].map((c, i) => cell(c, i < W - r.bLen ? 'f' : '')).join(''),
              cell('', 'rr') +
                [...r.R].map((c, i) => cell(c, 'rr' + (lead >= 0 && i < lead ? ' f' : ''))).join(''),
            ].join('');
            const word = op === '+' ? 'retenues' : 'emprunts';
            const columns =
              r.cols.length > 17
                ? []
                : r.cols.map((c) => {
                    if (op === '+') {
                      return `colonne ${pw(2, c.pos)} : ${c.x} + ${c.y}${c.cin ? ' + 1 (retenue)' : ''} = ${c.x + c.y + c.cin}, on écrit <mark>${c.r}</mark>${c.cout ? ' et on retient 1' : ''}.`;
                    }
                    const borrow =
                      c.x - c.y - c.cin < 0 ? `, on emprunte 2 : ${c.x + 2} − ${c.y + c.cin}` : '';
                    return `colonne ${pw(2, c.pos)} : ${c.x} − ${c.y}${c.cin ? ' − 1 (emprunt)' : ''}${borrow}, on écrit <mark>${c.r}</mark>${c.cout ? ' et on reporte un emprunt' : ''}.`;
                  });
            const total = op === '+' ? r.va + r.vb : r.va - r.vb;
            const shownA = G(NB.addSub(valueOf('o-a'), '0', '+').a);
            const shownB = G(NB.addSub(valueOf('o-b'), '0', '+').a);
            const shownR = r.result.startsWith('−') ? '−' + G(r.result.slice(1)) : G(r.result);
            return {
              answer: `${ans(shownA, 2)} ${sym} ${ans(shownB, 2)} = ${ans(shownR, 2)}`,
              note: r.swapped
                ? 'le second nombre est plus grand : on calcule second − premier et le résultat est négatif.'
                : '',
              viz: `<div><h3>opération posée</h3><div class="scroll"><div class="cols" style="grid-template-columns:repeat(${W + 1},28px)">${grid}</div></div><p class="note">au-dessus, en couleur : les ${word}.</p></div>`,
              steps: [
                op === '+'
                  ? 'on aligne les nombres à droite et on additionne colonne par colonne. 1 + 1 = 10 : on écrit 0 et on retient 1. 1 + 1 + 1 = 11 : on écrit 1 et on retient 1.'
                  : 'on aligne les nombres à droite et on soustrait colonne par colonne. pour 0 − 1, on emprunte 2 à la colonne de gauche : 2 − 1 = 1, et la colonne de gauche reçoit un emprunt de 1.',
                ...columns,
                `résultat : <mark>${r.result}</mark>.`,
                `vérification en décimal : ${nf(r.va)} ${sym} ${nf(r.vb)} = ${nf(total)} <span class="ok">✓</span>`,
              ],
            };
          },
          [
            ['10110110 + 1101101', { 'o-a': '10110110', 'o-op': '+', 'o-b': '1101101' }],
            ['11001010 − 1011011', { 'o-a': '11001010', 'o-op': '-', 'o-b': '1011011' }],
            ['1111 + 1', { 'o-a': '1111', 'o-op': '+', 'o-b': '1' }],
          ],
          {
            'o-op': {
              '+': { 'o-a': '10110110', 'o-b': '1101101' },
              '-': { 'o-a': '11001010', 'o-b': '1011011' },
            },
          },
        );

        const bitsSelect = (id, selected) =>
          `<select id="${id}">${[4, 8, 16, 32].map((b) => `<option value="${b}"${b === selected ? ' selected' : ''}>${b} bits</option>`).join('')}</select>`;

        tab(
          'complement',
          'complément à deux',
          () =>
            `<div class="fields">${field(
              'mode',
              seg(
                'c-m',
                [
                  ['e', 'coder un entier'],
                  ['d', 'décoder des bits'],
                ],
                'e',
              ),
              { wide: true },
            )}${field('valeur', input('c-n', '-37'), { wide: true, forId: 'c-n' })}${field('taille', bitsSelect('c-b', 8), { forId: 'c-b' })}${field(
              'saisie en',
              seg(
                'c-f',
                [
                  ['bin', 'binaire'],
                  ['hex', 'hexadécimal'],
                ],
                'bin',
              ),
              { wide: true },
            )}</div>`,
          () => {
            const mode = valueOf('c-m');
            showField('c-b', mode === 'e');
            showField('c-f', mode === 'd');
            const signCls = (k) => (k === 0 ? 's' : '');

            if (mode === 'e') {
              const n = +valueOf('c-b');
              const r = NB.tcEncode(valueOf('c-n'), n);
              if (r.err) return r;
              const steps = [
                `sur ${n} bits, on peut coder de ${nf(r.min)} à ${nf(r.max)} : ${nf(r.v)} est dans la plage <span class="ok">✓</span>`,
                `on écrit |${nf(r.v)}| = ${nf(r.abs)} en binaire (${binSum(NB.weights(r.abs.toString(2), 2))}) sur ${n} bits : ${G(r.absBin)}.`,
              ];
              if (!r.neg) {
                steps.push('le nombre est positif : il s’écrit tel quel et le bit de signe vaut 0.');
              } else {
                steps.push(
                  `on inverse tous les bits : ${G(r.inv)}.`,
                  `on ajoute 1 : ${G(r.inv)} + 1 = <mark>${G(r.result)}</mark>.`,
                  'le bit de gauche vaut 1 : le nombre est bien négatif.',
                );
              }
              const hx = r.hex
                ? binToHexSection(r.result, { cls: signCls, title: 'écriture hexadécimale' })
                : null;
              if (hx) steps.push(...hx.steps);
              if (r.neg)
                steps.push(
                  `vérification : ${pw(2, n)} − ${nf(r.abs)} = ${nf(r.shortcut)}, qui s’écrit bien ${G(r.result)} en binaire <span class="ok">✓</span>`,
                );
              const rows = r.neg
                ? row('inversion', bits(r.inv, { hex: false, cls: () => 'a' })) +
                  row('plus 1', bits(r.result, { hex: false, cls: signCls }))
                : row('résultat', bits(r.result, { hex: false, cls: signCls }));
              return {
                answer: `${nf(r.v)} s’écrit ${ans(G(r.result), 2)}${r.hex ? ` = ${ans(r.hex, 16)}` : ''}`,
                viz: `<div><div class="stack">${row(`|n| = ${nf(r.abs)}`, bits(r.absBin, { hex: false }))}${rows}</div><div class="legend"><span style="--c:var(--sign)">bit de signe</span></div></div>${hx ? hx.viz : ''}`,
                steps,
              };
            }

            const r = NB.tcDecode(valueOf('c-n'), valueOf('c-f'));
            if (r.err) return r;
            const hx = valueOf('c-f') === 'hex' ? hexToBinSection(valueOf('c-n')) : null;
            const steps = [
              ...(hx ? hx.steps : [`on a ${r.n} bits : ${G(r.bits)}.`]),
              `le bit de signe vaut ${r.bits[0]} : le nombre est ${r.neg ? 'négatif' : 'positif'}.`,
            ];
            if (!r.neg) {
              steps.push(
                `on convertit directement : ${binSum(NB.weights(r.bits, 2))} = <mark>${nf(r.value)}</mark>.`,
              );
            } else {
              steps.push(
                `on inverse tous les bits : ${G(r.inv)}.`,
                `on ajoute 1 : ${G(r.magBin)} = ${binSum(NB.weights(r.magBin, 2))} = ${nf(r.mag)}.`,
                `on remet le signe : <mark>${nf(r.value)}</mark>.`,
                `vérification : ${nf(r.u)} − ${pw(2, r.n)} = ${nf(r.u)} − ${nf(r.pow)} = ${nf(r.value)} <span class="ok">✓</span>`,
              );
            }
            const rows = r.neg
              ? row('inversion', bits(r.inv, { hex: false, cls: () => 'a' })) +
                row('plus 1', bits(r.magBin, { hex: false }))
              : '';
            return {
              answer: `${valueOf('c-f') === 'hex' ? `${ans(r.hex, 16)} = ` : ''}${ans(G(r.bits), 2)} = ${nf(r.value)}`,
              viz: `${hx ? hx.viz : ''}<div class="stack">${row('bits reçus', bits(r.bits, { hex: false, cls: signCls }))}${rows}</div>`,
              steps,
            };
          },
          [
            ['−37 sur 8 bits', { 'c-m': 'e', 'c-n': '-37', 'c-b': '8' }],
            ['−100 sur 8 bits', { 'c-m': 'e', 'c-n': '-100', 'c-b': '8' }],
            ['−300 sur 16 bits', { 'c-m': 'e', 'c-n': '-300', 'c-b': '16' }],
            ['−2024 sur 16 bits', { 'c-m': 'e', 'c-n': '-2024', 'c-b': '16' }],
            ['−23 sur 16 bits', { 'c-m': 'e', 'c-n': '-23', 'c-b': '16' }],
            ['décoder 11001001', { 'c-m': 'd', 'c-n': '11001001', 'c-f': 'bin' }],
            ['décoder FFE9', { 'c-m': 'd', 'c-n': 'FFE9', 'c-f': 'hex' }],
          ],
          {
            'c-m': { e: { 'c-n': '-37', 'c-b': '8' }, d: { 'c-n': '11001001', 'c-f': 'bin' } },
            'c-f': { bin: { 'c-n': '11001001' }, hex: { 'c-n': 'FFE9' } },
          },
        );

        tab(
          'fixe',
          'virgule fixe',
          () =>
            `<div class="fields">${field(
              'mode',
              seg(
                'f-m',
                [
                  ['e', 'coder un décimal'],
                  ['d', 'décoder des bits'],
                ],
                'e',
              ),
              { wide: true },
            )}${field('valeur', input('f-n', '9,8125'), { wide: true, forId: 'f-n' })}${field('bits entiers', input('f-i', '4', true), { forId: 'f-i' })}${field('bits décimaux', input('f-f', '4', true), { forId: 'f-f' })}</div>`,
          () => {
            const mode = valueOf('f-m');
            const intBits = Math.max(1, Math.min(32, +valueOf('f-i') || 1));
            const fracBits = Math.max(0, Math.min(32, +valueOf('f-f') || 0));
            showField('f-i', mode === 'e');
            showField('f-f', mode === 'e');
            const split = (k) => (k < intBits ? 'e' : 'mt');

            if (mode === 'e') {
              const r = NB.fixedEncode(valueOf('f-n'), intBits, fracBits);
              if (r.err) return r;
              const shown = r.p.int + (r.p.frac ? ',' + r.p.frac : '');
              const fracList = r.steps
                .slice(0, 8)
                .map((s) => `${s.before} × 2 = ${s.after}, bit ${s.bit}`)
                .join(' ; ');
              return {
                answer: `${shown} s’écrit ${ans(G(r.intBin) + ',' + r.fracBin.replace(/(.{4})(?=.)/g, '$1 '), 2)}`,
                note: r.exact
                  ? ''
                  : `la partie décimale ne tombe pas juste sur ${fracBits} bits : la valeur réellement stockée est ${r.stored}.`,
                viz: `<div><h3>partie entière, divisions par 2</h3>${potence(r.div.rows, 2)}${readout(r.div.rows)}</div>
            <div><h3>partie décimale, multiplications par 2</h3>${fracTable(r.steps)}</div>
            <div><h3>mot de ${intBits} + ${fracBits} bits</h3>${bits(r.intBin + r.fracBin, { hex: false, cls: split, weights: true })}<div class="legend"><span style="--c:var(--exp)">partie entière</span><span style="--c:var(--mant)">partie décimale</span></div></div>`,
                steps: [
                  `partie entière : ${r.p.int} = ${binSum(NB.weights(r.ip.toString(2), 2))}, soit ${r.ip.toString(2)}, complété à ${intBits} bits : <mark>${G(r.intBin)}</mark>.`,
                  r.steps.length
                    ? `partie décimale : on multiplie par 2 et on garde le chiffre avant la virgule, ${r.steps.length} fois : ${fracList}${r.steps.length > 8 ? ' ; …' : ''}.`
                    : 'pas de partie décimale : les bits après la virgule valent 0.',
                  r.exact
                    ? `la partie décimale est tombée à 0, la conversion est exacte. on complète à droite avec des 0 : <mark>${r.fracBin}</mark>.`
                    : `on s’arrête quand les ${fracBits} bits sont remplis, la suite est tronquée : <mark>${r.fracBin}</mark>.`,
                  `on assemble : <mark>${G(r.intBin)},${r.fracBin}</mark>.`,
                ],
              };
            }

            const r = NB.fixedDecode(valueOf('f-n'));
            if (r.err) return r;
            const tiles = [
              ...r.intTerms.map(
                (t) =>
                  `<div class="wc"><b>1</b><span>${pw(2, t.pos)}</span><em>${nf(1n << BigInt(t.pos))}</em></div>`,
              ),
              ...r.fracTerms.map(
                (t) => `<div class="wc"><b>1</b><span>${pw(2, t.pos)}</span><em>${t.w}</em></div>`,
              ),
            ];
            return {
              answer: `${ans(r.ib + ',' + r.fb, 2)} = ${r.value}`,
              viz: `<div><h3>bits et poids</h3>${bits(r.ib + r.fb, { hex: false, cls: (k) => (k < r.ib.length ? 'e' : 'mt') })}</div><div class="wcols">${tiles.join('')}</div>`,
              steps: [
                `partie entière ${r.ib} = ${r.intTerms.map((t) => nf(1n << BigInt(t.pos))).join(' + ') || '0'} = ${nf(r.iv)}.`,
                `partie décimale ${r.fb || '0'} : les poids sont 0,5, 0,25, 0,125, 0,0625, etc. ; bits à 1 : ${r.fracTerms.map((t) => t.w).join(' + ') || '0'} = 0,${r.value.split(',')[1]}.`,
                `total : <mark>${r.value}</mark>.`,
              ],
            };
          },
          [
            ['9,8125 sur 4 + 4 bits', { 'f-m': 'e', 'f-n': '9,8125', 'f-i': '4', 'f-f': '4' }],
            ['45,375 sur 8 + 8 bits', { 'f-m': 'e', 'f-n': '45,375', 'f-i': '8', 'f-f': '8' }],
            ['0,67 sur 16 + 16 bits', { 'f-m': 'e', 'f-n': '0,67', 'f-i': '16', 'f-f': '16' }],
            ['décoder 0110,1010', { 'f-m': 'd', 'f-n': '0110,1010' }],
          ],
          { 'f-m': { e: { 'f-n': '9,8125', 'f-i': '4', 'f-f': '4' }, d: { 'f-n': '0110,1010' } } },
        );

        tab(
          'ieee',
          'ieee 754',
          () =>
            `<div class="fields">${field(
              'mode',
              seg(
                'i-m',
                [
                  ['e', 'coder un réel'],
                  ['d', 'décoder'],
                ],
                'e',
              ),
              { wide: true },
            )}${field('valeur', input('i-n', '12,375'), { wide: true, forId: 'i-n' })}${field(
              'format',
              seg(
                'i-f',
                [
                  ['float', 'float, 32 bits'],
                  ['double', 'double, 64 bits'],
                ],
                'float',
              ),
              { wide: true },
            )}${field(
              'saisie en',
              seg(
                'i-s',
                [
                  ['hex', 'hexadécimal'],
                  ['bin', 'binaire'],
                ],
                'hex',
              ),
              { wide: true },
            )}</div>`,
          () => {
            const mode = valueOf('i-m');
            showField('i-f', mode === 'e');
            showField('i-s', mode === 'd');
            const legend = (F) =>
              `<div class="legend"><span style="--c:var(--sign)">signe, 1 bit</span><span style="--c:var(--exp)">exposant, ${F.E} bits</span><span style="--c:var(--mant)">mantisse, ${F.M} bits</span></div>`;
            const fieldCls = (F) => (k) => (k === 0 ? 's' : k <= F.E ? 'e' : 'mt');
            const hexNote = (F) =>
              `<p class="note">les paquets de 4 bits servent uniquement à passer entre binaire et hexadécimal. ils sont pris sur les ${F.total} bits à la suite, en partant de la droite, sans tenir compte des champs : le premier paquet contient donc le bit de signe et les 3 premiers bits de l'exposant.</p>`;

            if (mode === 'e') {
              const r = NB.ieeeEncode(valueOf('i-n'), valueOf('i-f'));
              if (r.err) return r;
              const F = r.F;
              const shown = (r.p.neg ? '−' : '') + r.p.int + (r.p.frac ? ',' + r.p.frac : '');

              if (r.special) {
                const message = {
                  zero: 'zéro est un cas particulier : exposant et mantisse valent 0.',
                  denormal:
                    'ce nombre est trop petit pour la forme normalisée : il est codé en dénormalisé, ce qui sort du programme. le codage machine est affiché.',
                  inf: `ce nombre est trop grand pour un ${F.name} : il devient l'infini.`,
                }[r.special];
                return {
                  answer: `${shown} s’écrit ${ans(r.hex, 16)}`,
                  note: message,
                  viz: ieeeFields(F, r.bits[0], r.bits.slice(1, 1 + F.E), r.bits.slice(1 + F.E), [
                    '',
                    '',
                    '',
                  ]),
                  steps: [message],
                };
              }

              const shift =
                r.e0 > 0
                  ? `de ${r.e0} rang${r.e0 > 1 ? 's' : ''} vers la gauche`
                  : r.e0 < 0
                    ? `de ${-r.e0} rang${r.e0 < -1 ? 's' : ''} vers la droite`
                    : 'sans déplacement';
              const fixed = r.fixedRepr;
              const leadAt = fixed.indexOf('1');
              const fixedHtml =
                esc(fixed.slice(0, leadAt)) + '<span class="one">1</span>' + esc(fixed.slice(leadAt + 1));
              const mantShown = r.normalized.slice(2);
              const rounding = !r.roundBit
                ? `le ${F.M + 1}e bit, celui qui suit la mantisse, vaut 0 : on tronque sans arrondir.`
                : r.up
                  ? `le ${F.M + 1}e bit vaut 1 : on arrondit en ajoutant 1 au dernier bit de la mantisse${r.carryOut ? ', et la retenue augmente l’exposant de 1' : ''}.`
                  : `le ${F.M + 1}e bit vaut 1 mais n'est suivi que de 0 : c'est une égalité parfaite, la norme arrondit vers le bit pair, donc on ne change rien.`;
              const intPart =
                r.ip > 0n ? `${r.p.int} = ${binSum(NB.weights(r.intBin, 2))}, soit ${r.intBin}` : '0';
              const signWord = r.sign ? 'négatif' : 'positif';
              const err = NB.ieeeError(shown, r.hex);
              const absShown = shown.replace('−', '');
              const errorViz = err
                ? `<div><h3>7. erreur de codage</h3><div class="scroll"><table class="t"><tbody>
              <tr><td class="l">valeur saisie</td><td>${shown}</td></tr>
              <tr><td class="l">valeur stockée</td><td>${err.stored}</td></tr>
              <tr class="hl"><td class="l">erreur absolue</td><td>${err.abs}</td></tr>
              <tr><td class="l">erreur relative</td><td>${err.abs === '0' ? '0' : `${sci(err.rel)}, soit ${sci(err.rel * 100)} %`}</td></tr>
            </tbody></table></div></div>`
                : '';
              const errorSteps = !err
                ? []
                : err.abs === '0'
                  ? [
                      'erreur de codage : la valeur stockée est exactement la valeur saisie, l’erreur est nulle.',
                    ]
                  : [
                      `erreur de codage : on décode ${r.hex} pour retrouver la valeur réellement stockée, ${err.stored}.`,
                      `erreur absolue : |${err.stored} − (${shown})| = <mark>${err.abs}</mark>.`,
                      `erreur relative : ${err.abs} ÷ ${absShown} ≈ ${sci(err.rel)}, soit environ ${sci(err.rel * 100)} %.`,
                    ];

              return {
                answer: `${shown} s’écrit ${ans(r.hex, 16)}`,
                note: r.check
                  ? `<span class="ok">✓ identique au codage de la machine.</span> valeur réellement stockée : ${err ? err.stored : String(r.storedValue).replace('.', ',')}.`
                  : `attention, la machine donne ${r.machineHex}.`,
                viz: `
            <div><h3>1. écriture en binaire</h3>${r.ip > 0n ? potence(r.div.rows, 2) + readout(r.div.rows) : ''}${r.steps.length ? fracTable(r.steps, 30) : ''}</div>
            <div><h3>2. normalisation</h3><div class="norm">${fixedHtml} = <span class="one">1</span>,<span class="mt">${esc(mantShown)}</span> × 2<sup>${r.e0}</sup><span class="hint">virgule déplacée ${shift}</span></div></div>
            <div><h3>3. exposant : ${r.e} + ${F.bias} = ${r.expStored}</h3>${potence(r.expDiv.rows, 2)}${readout(r.expDiv.rows)}</div>
            <div><h3>4. mantisse et arrondi</h3><div class="cells">${[...r.mantRaw].map((c) => `<span class="bit mt">${c}</span>`).join('')}<span class="bit a">${r.roundBit}</span></div><p class="note">la case orange est le ${F.M + 1}e bit : il n'est pas stocké, il sert seulement à décider de l'arrondi.</p></div>
            <div><h3>5. les trois champs</h3>${ieeeFields(F, String(r.sign), r.expBin, r.mant, [signWord, `${r.expStored} = ${r.e} + ${F.bias}`, `1,${mantShown}`])}</div>
            ${binToHexSection(r.bits, { cls: fieldCls(F), title: '6. écriture hexadécimale', extra: legend(F) + hexNote(F) }).viz}
            ${errorViz}`,
                steps: [
                  `signe : le nombre est ${signWord}, le bit de signe vaut <mark>${r.sign}</mark>. on continue avec la valeur absolue.`,
                  `partie entière : ${intPart}.`,
                  r.steps.length
                    ? `partie décimale : multiplications successives par 2, ${r.steps.length} ligne${r.steps.length > 1 ? 's' : ''}${r.exactFrac ? ', jusqu’à tomber sur 0' : '. elle ne tombe jamais sur 0 : on s’arrête quand on a assez de bits'}. on obtient 0,${r.fracBin}${r.exactFrac ? '' : '…'}.`
                    : 'pas de partie décimale.',
                  `en binaire : ${esc(r.fixedRepr)}.`,
                  `normalisation : on déplace la virgule ${shift} pour ne garder qu'un 1 devant : 1,${esc(mantShown)} × 2<sup>${r.e0}</sup>, donc e = ${r.e0}.`,
                  `exposant stocké : e + ${F.bias} = ${r.e} + ${F.bias} = ${r.expStored}, soit <mark>${r.expBin}</mark> sur ${F.E} bits.`,
                  `mantisse : on garde les ${F.M} bits après la virgule. le 1 de devant n'est pas stocké.`,
                  rounding,
                  `mantisse finale : ${r.mant}.`,
                  `on met bout à bout signe, exposant et mantisse : ${r.sign} ${r.expBin} ${r.mant}.`,
                  `pour l'hexadécimal, on reprend les ${F.total} bits à la suite, sans tenir compte des champs.`,
                  ...binToHexSection(r.bits).steps,
                  ...errorSteps,
                ],
              };
            }

            const source = valueOf('i-s');
            const r = NB.ieeeDecode(valueOf('i-n'), source);
            if (r.err) return r;
            const F = r.F;
            const steps = [];
            const hx =
              source === 'hex'
                ? hexToBinSection(valueOf('i-n'), { cls: fieldCls(F), extra: legend(F) + hexNote(F) })
                : null;
            if (hx) steps.push(...hx.steps);
            steps.push(
              `on découpe les ${F.total} bits en trois champs : signe ${r.sign}, exposant ${r.expBin}, mantisse ${r.mantBin}.`,
            );
            let answer;
            let valueViz = '';
            if (r.kind === 'normal') {
              steps.push(
                `signe : ${r.sign}, le nombre est ${r.sign ? 'négatif' : 'positif'}.`,
                `exposant : ${binSum(r.expW)} = ${r.expStored}, donc e = ${r.expStored} − ${F.bias} = <mark>${r.e}</mark>.`,
                `on remet le 1 caché devant la mantisse : ${r.sign ? '−' : ''}${r.normalized} × 2<sup>${r.e}</sup>.`,
              );
              if (r.fixedInt !== undefined) {
                steps.push(
                  `on déplace la virgule de ${Math.abs(r.e)} rang${Math.abs(r.e) > 1 ? 's' : ''} vers la ${r.e >= 0 ? 'droite' : 'gauche'} : ${r.sign ? '−' : ''}${r.fixedInt}${r.fixedFrac ? ',' + r.fixedFrac : ''}.`,
                  `en décimal : <mark>${r.exact}</mark>.`,
                );
              }
              answer = `${source === 'hex' ? ans(r.hex, 16) : ans(`${r.sign} ${r.expBin} ${r.mantBin}`, 2)} = ${r.exact ?? String(r.value).replace('.', ',')}`;
              valueViz = `<div><h3>valeur</h3><div class="norm">${r.sign ? '−' : ''}<span class="one">1</span>,<span class="mt">${esc(r.m || '0')}</span> × 2<sup>${r.e}</sup>${r.fixedInt !== undefined ? ` = ${r.sign ? '−' : ''}${r.fixedInt}${r.fixedFrac ? ',' + r.fixedFrac : ''}<sub>2</sub> = ${r.exact}` : ''}</div></div>`;
            } else {
              const message = {
                zero: 'exposant et mantisse à 0 : c’est zéro.',
                denormal: 'exposant à 0 et mantisse non nulle : nombre dénormalisé, hors programme.',
                inf: 'exposant rempli de 1 et mantisse nulle : c’est l’infini.',
                nan: 'exposant rempli de 1 et mantisse non nulle : NaN, pas un nombre.',
              }[r.kind];
              steps.push(message);
              answer = `${source === 'hex' ? ans(r.hex, 16) : ans(`${r.sign} ${r.expBin} ${r.mantBin}`, 2)} = ${String(r.value).replace('.', ',')}`;
            }
            const captions =
              r.kind === 'normal'
                ? [r.sign ? 'négatif' : 'positif', `${r.expStored} − ${F.bias} = ${r.e}`, `1,${r.m || '0'}`]
                : ['', `${r.expStored}`, ''];
            const fromHex = hx ? hx.viz : '';
            return {
              answer,
              note: `format détecté : ${F.name}.`,
              viz: `${fromHex}<div><h3>les trois champs</h3>${ieeeFields(F, String(r.sign), r.expBin, r.mantBin, captions)}</div>${valueViz}`,
              steps,
            };
          },
          [
            ['6,5', { 'i-m': 'e', 'i-n': '6,5', 'i-f': 'float' }],
            ['−0,75', { 'i-m': 'e', 'i-n': '-0,75', 'i-f': 'float' }],
            ['12,375', { 'i-m': 'e', 'i-n': '12,375', 'i-f': 'float' }],
            ['−9,2', { 'i-m': 'e', 'i-n': '-9,2', 'i-f': 'float' }],
            ['0,1 en double', { 'i-m': 'e', 'i-n': '0,1', 'i-f': 'double' }],
            ['décoder 41480000', { 'i-m': 'd', 'i-s': 'hex', 'i-n': '41480000' }],
            ['décoder C1133333', { 'i-m': 'd', 'i-s': 'hex', 'i-n': 'C1133333' }],
            [
              'décoder 0 10000010 10010000000000000000000',
              { 'i-m': 'd', 'i-s': 'bin', 'i-n': '0 10000010 10010000000000000000000' },
            ],
          ],
          {
            'i-m': { e: { 'i-n': '12,375', 'i-f': 'float' }, d: { 'i-n': '41480000', 'i-s': 'hex' } },
            'i-s': { hex: { 'i-n': '41480000' }, bin: { 'i-n': '0 10000010 10010000000000000000000' } },
          },
        );

        const MESSAGE =
          '010000100111001001100001011101100110111100101100001000000111011001101111011101010111001100100000111010100111010001100101011100110010000001100001011101010010000001100010011011110111010101110100001000000110010001100101001000000110110000100111111010010111011001100001011011000010000000100001';
        const byteCards = (bytes) =>
          `<div class="bytes">${bytes.map((b) => `<div class="byte${b.ascii ? '' : ' ext'}"><span class="bb">${b.bits}</span><span class="bv">${b.val} · ${b.hex}</span><b>${esc(b.label)}</b></div>`).join('')}</div>`;
        const byteSum = (b) => {
          const sum = binSum(NB.weights(b.bits, 2));
          return sum.includes('+') ? `${sum} = ${b.val}` : String(b.val);
        };
        const byteNote =
          '<p class="note">chaque carte donne les 8 bits, la valeur en décimal et en hexadécimal, puis le caractère de la table ascii.</p>';

        tab(
          'texte',
          'texte et ascii',
          () =>
            `<div class="fields">${field(
              'mode',
              seg(
                'a-m',
                [
                  ['d', 'décoder des bits'],
                  ['e', 'coder un texte'],
                ],
                'd',
              ),
              { wide: true },
            )}${field('valeur', input('a-n', MESSAGE), { wide: true, forId: 'a-n' })}</div>`,
          () => {
            if (valueOf('a-m') === 'd') {
              const r = NB.bitsToText(valueOf('a-n'));
              if (r.err) return r;
              const ext = r.bytes.filter((b) => !b.ascii).length;
              return {
                answer: `« ${esc(r.text)} »`,
                note: ext
                  ? `${ext} octet${ext > 1 ? 's dépassent' : ' dépasse'} 127 : ${ext > 1 ? 'ils sont lus' : 'il est lu'} en latin-1, l'extension sur 8 bits de la table ascii.`
                  : '',
                viz: `<div><h3>${r.bytes.length} octet${r.bytes.length > 1 ? 's' : ''} de 8 bits</h3>${byteCards(r.bytes)}${byteNote}${ext ? '<div class="legend"><span style="--c:var(--accent)">hors de la table ascii, lu en latin-1</span></div>' : ''}</div>`,
                steps: [
                  `on a ${r.s.length} bits : on les découpe en ${r.bytes.length} octet${r.bytes.length > 1 ? 's' : ''} de 8 bits, en partant de la gauche, car le texte se lit dans l'ordre.`,
                  ...r.bytes.map((b) =>
                    b.ascii
                      ? `${b.bits} = ${byteSum(b)}, soit « <mark>${esc(b.label)}</mark> » dans la table ascii`
                      : `${b.bits} = ${byteSum(b)}, hors de la table ascii (0 à 127) : en latin-1, ${b.val} correspond à « <mark>${esc(b.label)}</mark> »`,
                  ),
                  `on met les caractères bout à bout : <mark>${esc(r.text)}</mark>.`,
                ],
              };
            }
            const r = NB.textToBits(valueOf('a-n'));
            if (r.err) return r;
            const spaced = r.bytes.map((b) => b.bits).join(' ');
            return {
              answer: `« ${esc(r.text)} » s’écrit ${ans(spaced, 2)}`,
              viz: `<div><h3>un octet par caractère</h3>${byteCards(r.bytes)}${byteNote}</div>`,
              steps: [
                'chaque caractère est remplacé par son code dans la table ascii, écrit sur 8 bits.',
                ...r.bytes.map(
                  (b) =>
                    `« ${esc(b.label)} » = ${b.val}${b.ascii ? '' : ' en latin-1'} = ${binSum(NB.weights(b.bits, 2))}, soit ${b.bits}`,
                ),
                `on met les octets bout à bout : <mark>${spaced}</mark>.`,
              ],
            };
          },
          [
            ['décoder le message de l’éval', { 'a-m': 'd', 'a-n': MESSAGE }],
            ['décoder 01001111 01001011', { 'a-m': 'd', 'a-n': '01001111 01001011' }],
            ['coder « BTS SIO »', { 'a-m': 'e', 'a-n': 'BTS SIO' }],
          ],
          { 'a-m': { d: { 'a-n': MESSAGE }, e: { 'a-n': 'BTS SIO' } } },
        );

        const unitSelect = (id, selected) =>
          `<select id="${id}">${NB.UNITS.map((u) => `<option${u.k === selected ? ' selected' : ''}>${u.k}</option>`).join('')}</select>`;
        const sci = (x) => {
          if (!x) return '0';
          const [m, exp] = x.toExponential(2).split('e');
          if (+exp >= -3 && +exp <= 3) return String(+x.toPrecision(3)).replace('.', ',');
          return `${m.replace('.', ',')} × 10<sup>${exp.replace('-', '−').replace('+', '')}</sup>`;
        };
        const fr = (x) => x.toLocaleString('fr-FR', { maximumFractionDigits: 6 });
        const powLabel = (l) => l.replace(/\^(\d+)/, '<sup>$1</sup>');

        tab(
          'unites',
          'unités et plages',
          () =>
            `<div class="fields">${field('quantité', input('u-v', '2', true), { forId: 'u-v' })}${field('unité de départ', unitSelect('u-a', 'To'), { forId: 'u-a' })}${field("unité d'arrivée", unitSelect('u-b', 'Tio'), { forId: 'u-b' })}${field('plage sur n bits', input('u-n', '16', true), { forId: 'u-n' })}</div>`,
          () => {
            const r = NB.units(valueOf('u-v'), valueOf('u-a'), valueOf('u-b'));
            if (r.err) return r;
            const n = Math.max(1, Math.min(64, +valueOf('u-n') || 8));
            const g = NB.ranges(n);
            const dec = NB.UNITS.slice(2, 6),
              bin = NB.UNITS.slice(6);
            const line = (u, v) =>
              `<tr${u.k === r.U2.k || v.k === r.U2.k ? ' class="hl"' : ''}><td>${fr(r.bytes / u.f)} ${u.k}</td><td>${fr(r.bytes / v.f)} ${v.k}</td></tr>`;
            return {
              answer: `${fr(r.v)} ${r.U1.k} = ${fr(r.res)} ${r.U2.k}`,
              viz: `<div><h3>la même quantité dans chaque unité</h3><div class="scroll"><table class="t"><thead><tr><th>préfixes décimaux, 10<sup>n</sup></th><th>préfixes binaires, 2<sup>n</sup></th></tr></thead><tbody>${dec.map((u, i) => line(u, bin[i])).join('')}</tbody></table></div></div>
          <div><h3>plages sur ${n} bits</h3><div class="scroll"><table class="t"><thead><tr><th>type</th><th>minimum</th><th>maximum</th></tr></thead><tbody><tr><td class="l">non signé</td><td>0</td><td>${nf(g.umax)}</td></tr><tr><td class="l">signé, complément à deux</td><td>${nf(g.smin)}</td><td>${nf(g.smax)}</td></tr></tbody></table></div></div>`,
              steps: [
                `on convertit d'abord en octets : ${fr(r.v)} ${r.U1.k} × ${powLabel(r.U1.label)} = ${fr(r.bytes)} o.`,
                `on divise par la taille de l'unité d'arrivée : ${fr(r.bytes)} ÷ ${powLabel(r.U2.label)} = <mark>${fr(r.res)} ${r.U2.k}</mark>.`,
                'rappel : ko, Mo, Go et To sont des puissances de 10. Kio, Mio, Gio et Tio sont des puissances de 2, avec 1 Kio = 1 024 o.',
                `sur ${n} bits : non signé de 0 à ${pw(2, n)} − 1 = ${nf(g.umax)}, signé de −${pw(2, n - 1)} = ${nf(g.smin)} à ${pw(2, n - 1)} − 1 = ${nf(g.smax)}.`,
              ],
            };
          },
          [
            ['2 To en Tio', { 'u-v': '2', 'u-a': 'To', 'u-b': 'Tio' }],
            ['256 Gio en Go', { 'u-v': '256', 'u-a': 'Gio', 'u-b': 'Go' }],
            ['500 Go en Gio', { 'u-v': '500', 'u-a': 'Go', 'u-b': 'Gio' }],
            ['plage sur 16 bits', { 'u-n': '16' }],
          ],
        );

        const fieldsBits = (bits, F) => `${bits[0]} ${bits.slice(1, 1 + F.E)} ${bits.slice(1 + F.E)}`;
        const CARRY = {
          poids: {
            'w-b': (to, from) => {
              const r = NB.weights(valueOf('w-n'), +from);
              return r.err ? null : { 'w-n': r.total.toString(+to).toUpperCase() };
            },
          },
          binhex: {
            'bh-m': (to) => {
              const r = to === 'h' ? NB.binToHex(valueOf('bh-n')) : NB.hexToBin(valueOf('bh-n'));
              return r.err ? null : { 'bh-n': r.result };
            },
          },
          complement: {
            'c-m': (to) => {
              if (to === 'd') {
                const r = NB.tcEncode(valueOf('c-n'), +valueOf('c-b'));
                if (r.err) return null;
                return valueOf('c-f') === 'hex' && r.hex
                  ? { 'c-n': r.hex }
                  : { 'c-n': r.result, 'c-f': 'bin' };
              }
              const r = NB.tcDecode(valueOf('c-n'), valueOf('c-f'));
              if (r.err || ![4, 8, 16, 32].includes(r.n)) return null;
              return { 'c-n': String(r.value), 'c-b': String(r.n) };
            },
            'c-f': (to) => {
              if (to === 'hex') {
                const r = NB.tcDecode(valueOf('c-n'), 'bin');
                return r.err || !r.hex ? null : { 'c-n': r.hex };
              }
              const r = NB.hexToBin(valueOf('c-n'));
              return r.err ? null : { 'c-n': r.full };
            },
          },
          fixe: {
            'f-m': (to) => {
              if (to === 'd') {
                const r = NB.fixedEncode(valueOf('f-n'), +valueOf('f-i') || 1, +valueOf('f-f') || 0);
                return r.err ? null : { 'f-n': `${r.intBin},${r.fracBin}` };
              }
              const r = NB.fixedDecode(valueOf('f-n'));
              return r.err
                ? null
                : { 'f-n': r.value, 'f-i': String(r.ib.length), 'f-f': String(r.fb.length) };
            },
          },
          texte: {
            'a-m': (to) => {
              const r = to === 'e' ? NB.bitsToText(valueOf('a-n')) : NB.textToBits(valueOf('a-n'));
              if (r.err) return null;
              return { 'a-n': to === 'e' ? r.text : r.bytes.map((b) => b.bits).join(' ') };
            },
          },
          ieee: {
            'i-m': (to) => {
              if (to === 'd') {
                const r = NB.ieeeEncode(valueOf('i-n'), valueOf('i-f'));
                if (r.err) return null;
                return valueOf('i-s') === 'bin' ? { 'i-n': fieldsBits(r.bits, r.F) } : { 'i-n': r.hex };
              }
              const r = NB.ieeeDecode(valueOf('i-n'), valueOf('i-s'));
              if (r.err || r.kind === 'inf' || r.kind === 'nan') return null;
              return {
                'i-n': r.exact ?? String(r.value).replace('.', ','),
                'i-f': r.F.total === 32 ? 'float' : 'double',
              };
            },
            'i-s': (to) => {
              const r = NB.ieeeDecode(valueOf('i-n'), to === 'bin' ? 'hex' : 'bin');
              if (r.err) return null;
              return to === 'bin' ? { 'i-n': fieldsBits(r.bits, r.F) } : { 'i-n': r.hex };
            },
          },
        };

        const HOME = {
          id: 'accueil',
          name: 'accueil',
          descriptions: {
            decimal: 'divisions successives vers la base 2, 8 ou 16',
            poids: 'somme des chiffres multipliés par leur poids',
            binhex: 'regroupement et développement par paquets de 4 bits',
            operations: 'opérations posées en binaire, avec retenues et emprunts',
            complement: 'coder et décoder des entiers négatifs sur n bits',
            fixe: 'partie entière et partie décimale sur un nombre fixe de bits',
            ieee: 'signe, exposant et mantisse, en float ou en double',
            texte: 'des octets aux caractères avec la table ascii, et inversement',
            unites: 'ko, Kio, Go, Gio et plages de valeurs sur n bits',
          },
        };

        function homePage() {
          const items = TABS.map(
            (t) =>
              `<li><button type="button" data-go="${t.id}"><b>${t.name}</b><span>${HOME.descriptions[t.id]}</span></button></li>`,
          );
          return `<section class="home"><h1><span aria-hidden="true">✻</span>correcteur de numération</h1><p>choisissez un type d'exercice. chaque résultat est corrigé étape par étape, avec un schéma.</p><ul>${items.join('')}</ul></section>`;
        }

        const PAGES = [HOME, ...TABS];
        const tabs = document.getElementById('tabs');
        const panel = document.getElementById('panel');
        const drawer = document.getElementById('drawer');
        const drawerList = document.getElementById('drawer-list');
        const scrim = document.getElementById('scrim');
        const burger = document.getElementById('burger');
        let current;
        const selectValues = {};

        tabs.innerHTML =
          `<button type="button" class="home-link" data-id="accueil" aria-label="accueil">✻</button>` +
          TABS.map((t) => `<button type="button" role="tab" data-id="${t.id}">${t.name}</button>`).join('');
        drawerList.innerHTML = TABS.map(
          (t) => `<li><button type="button" data-id="${t.id}">${t.name}</button></li>`,
        ).join('');

        function openDrawer() {
          drawer.inert = false;
          drawer.classList.add('open');
          scrim.hidden = false;
          burger.setAttribute('aria-expanded', 'true');
          drawerList.querySelector('[aria-current="true"]')?.focus();
        }

        function closeDrawer(returnFocus = false) {
          if (!drawer.classList.contains('open')) return;
          drawer.classList.remove('open');
          drawer.inert = true;
          scrim.hidden = true;
          burger.setAttribute('aria-expanded', 'false');
          if (returnFocus) burger.focus();
        }

        function show(id) {
          current = PAGES.find((t) => t.id === id) || HOME;
          tabs
            .querySelectorAll('button')
            .forEach((b) => b.setAttribute('aria-selected', String(b.dataset.id === current.id)));
          drawerList
            .querySelectorAll('button')
            .forEach((b) => b.setAttribute('aria-current', String(b.dataset.id === current.id)));
          document.getElementById('crumb').textContent = current.name;
          if (current === HOME) {
            panel.innerHTML = homePage();
            return;
          }
          const examples = current.examples
            .map(([label], i) => `<button type="button" data-i="${i}">${esc(label)}</button>`)
            .join('');
          panel.innerHTML = `<div class="enonce">${current.form()}<div class="ex">exemples ${examples}</div></div><div class="out" id="out" aria-live="polite"></div>`;
          panel.querySelectorAll('select').forEach((el) => (selectValues[el.id] = el.value));
          update();
        }

        function update() {
          let result;
          try {
            result = current.run();
          } catch (error) {
            console.error(error);
            result = { err: 'calcul impossible avec cette valeur, vérifiez la saisie.' };
          }
          sizeInputs();
          document.getElementById('out').innerHTML = render(result);
        }

        function setValue(id, value) {
          const el = document.getElementById(id);
          if (!el) return;
          if (el.classList.contains('seg')) {
            el.dataset.val = value;
            el.querySelectorAll('button').forEach((b) =>
              b.setAttribute('aria-pressed', String(b.dataset.v === value)),
            );
          } else {
            el.value = value;
            if (el.tagName === 'SELECT') selectValues[id] = el.value;
          }
        }

        const memory = {};
        const snapshot = () =>
          Object.fromEntries(
            [...panel.querySelectorAll('.enonce input, .enonce select, .enonce .seg')].map((el) => [
              el.id,
              valueOf(el.id),
            ]),
          );

        function switchMode(id, from, to) {
          const state = { ...snapshot(), [id]: from };
          const back = memory[current.id + id];
          if (
            back &&
            back.to === from &&
            back.before[id] === to &&
            JSON.stringify(state) === JSON.stringify(back.after)
          ) {
            Object.entries(back.before).forEach(([k, v]) => setValue(k, v));
            delete memory[current.id + id];
            return;
          }
          setValue(id, to);
          const carried = CARRY[current.id]?.[id]?.(to, from);
          if (carried) Object.entries(carried).forEach(([k, v]) => setValue(k, v));
          if (current.run().err) {
            const preset = current.presets?.[id]?.[to];
            if (preset) Object.entries(preset).forEach(([k, v]) => setValue(k, v));
          }
          memory[current.id + id] = { to, before: state, after: snapshot() };
        }

        function select(id) {
          show(id);
          closeDrawer();
          try {
            history.replaceState(null, '', id === HOME.id ? location.pathname : '#' + id);
          } catch (error) {}
        }

        function fit() {
          document.body.classList.remove('compact');
          const lines = new Set([...tabs.children].map((b) => b.offsetTop)).size;
          const compact = lines > 1;
          document.body.classList.toggle('compact', compact);
          if (!compact) closeDrawer();
        }

        tabs.addEventListener('click', (e) => {
          const b = e.target.closest('button');
          if (b) select(b.dataset.id);
        });
        drawerList.addEventListener('click', (e) => {
          const b = e.target.closest('button');
          if (b) {
            select(b.dataset.id);
            burger.focus();
          }
        });
        burger.addEventListener('click', openDrawer);
        drawer.querySelector('.drawer-home').addEventListener('click', () => {
          select('accueil');
          burger.focus();
        });
        scrim.addEventListener('click', () => closeDrawer(true));
        document.getElementById('drawer-close').addEventListener('click', () => closeDrawer(true));
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeDrawer(true);
        });

        panel.addEventListener('input', update);
        panel.addEventListener('change', (e) => {
          if (e.target.tagName === 'SELECT') {
            switchMode(e.target.id, selectValues[e.target.id], e.target.value);
            selectValues[e.target.id] = e.target.value;
          }
          update();
        });
        panel.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.target.blur();
        });
        panel.addEventListener('click', (e) => {
          const go = e.target.closest('[data-go]');
          if (go) {
            select(go.dataset.go);
            scrollTo(0, 0);
            return;
          }
          const segButton = e.target.closest('.seg button');
          if (segButton) {
            const id = segButton.parentElement.id;
            const from = valueOf(id);
            if (from !== segButton.dataset.v) switchMode(id, from, segButton.dataset.v);
            update();
            return;
          }
          const example = e.target.closest('.ex button');
          if (example) {
            Object.entries(current.examples[+example.dataset.i][1]).forEach(([k, v]) => setValue(k, v));
            update();
            if (innerWidth < 720) {
              const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
              document
                .querySelector('.result')
                ?.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
            }
          }
        });

        window.addEventListener('hashchange', () => {
          if (location.hash.slice(1) !== current.id) show(location.hash.slice(1));
        });
        let lastWidth = 0;
        new ResizeObserver(([entry]) => {
          const width = Math.round(entry.contentRect.width);
          if (width === lastWidth) return;
          lastWidth = width;
          requestAnimationFrame(fit);
        }).observe(document.querySelector('.wrap'));
        if (document.fonts) document.fonts.ready.then(fit);
        show(location.hash.slice(1));
        fit();
      })();
    </script>
  </body>
</html>
